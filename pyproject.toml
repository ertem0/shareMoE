[project]
name = "moe-engine"
version = "0.1.0"
description = "Distributed Mixture-of-Experts inference engine with experts spread across worker nodes"
readme = "README.md"
authors = [
    { name = "ertem0", email = "vasco.s.gouveia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.0.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
